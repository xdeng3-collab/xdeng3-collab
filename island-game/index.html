<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>拾荒岛</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-screen canvas (island or salvage puzzle), HUD floats over it, sheets rise from the bottom. */
:root{
  color-scheme: dark;
  --sea-deep:#0c4a63; --sea:#2aa3c4;
  --panel:#0e3443; --panel-2:#16485b; --line:#2b6c82;
  --ink:#f3fbfd; --ink-dim:#a9cdd8;
  --sun:#ffc93c; --sun-ink:#3a2a00; --bad:#ff7a6b; --good:#7fe08f;
  --font: "Fredoka", ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
html,body{height:100%}
body{background:var(--sea-deep);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#hud > *{pointer-events:none}
#top{padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
#resbar{display:flex;gap:6px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;justify-content:center;background:var(--panel);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 8px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.chip.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.12);border-color:var(--sun)}}
.cube{flex:none;width:14px;height:14px;border-radius:3.5px;background:var(--c);box-shadow:inset 0 -3.5px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.4)}
#row2{display:flex;gap:8px;align-items:flex-start}
#quest{pointer-events:auto;flex:1;min-width:0;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;
  display:flex;align-items:center;gap:10px}
#quest .q-l{flex:1;min-width:0}
#quest .q-k{font-size:11px;letter-spacing:.08em;color:var(--ink-dim)}
#quest .q-t{font-size:14px;font-weight:600;line-height:1.3}
#quest .q-p{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
#quest.done{border-color:var(--sun);animation:glow 1.2s infinite}
#quest .q-claim{background:var(--sun);color:var(--sun-ink);font-weight:700;border-radius:999px;padding:5px 12px;font-size:13px}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,201,60,.25)}}
.round{pointer-events:auto;flex:none;width:42px;height:42px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);display:grid;place-items:center}
.round svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bottom{padding-block:0 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#parts{pointer-events:auto;display:flex;gap:4px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:6px 8px}
.part{display:flex;align-items:center;gap:3px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;padding:0 3px}
.part svg{width:22px;height:22px}
.part.zero{opacity:.38}
#stat{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-dim);text-align:right;line-height:1.35}
#stat b{color:var(--ink);font-weight:700}

#pzui{position:absolute;inset:0 0 auto 0;pointer-events:none;padding-block:10px 0;display:flex;flex-direction:column;gap:6px}
#pzhead{display:flex;align-items:center;gap:10px}
#pzback{pointer-events:auto;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
#pzname{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pzcount{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px}
#pzbar{height:8px;border-radius:99px;background:rgba(6,36,48,.55);overflow:hidden}
#pzbar i{display:block;height:100%;width:0;background:var(--sun);border-radius:99px;transition:width .2s}
#pzhint{font-size:13.5px;font-weight:600;text-align:center;color:var(--ink);text-shadow:0 1px 3px rgba(0,40,55,.8);min-height:20px}

#scrim{position:absolute;inset:0;background:rgba(4,26,36,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--line);border-radius:22px 22px 0 0;
  padding-block:16px calc(16px + env(safe-area-inset-bottom, 0px));max-height:72%;overflow-y:auto;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
#sheet h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
#sheet p{margin:0;color:var(--ink-dim);font-size:14px;line-height:1.5}
.sh-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sh-head img{flex:none;width:64px;height:64px;border-radius:14px;background:var(--panel-2);object-fit:contain;image-rendering:pixelated}
.sh-head .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.x{flex:none;width:34px;height:34px;border-radius:50%;background:var(--panel-2);font-size:18px;line-height:1;align-self:flex-start}
.costs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cost{display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border-radius:999px;padding:4px 9px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cost svg{width:18px;height:18px}
.cost.lack{color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.kv span:first-child{color:var(--ink-dim)}
.kv span:last-child{font-weight:600;text-align:right}
.btn{display:block;width:100%;margin-top:14px;background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:17px;border-radius:16px;padding:13px 16px;
  box-shadow:inset 0 -4px 0 rgba(120,80,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(120,80,0,.35)}
.btn[disabled]{background:var(--panel-2);color:var(--ink-dim);box-shadow:none}
.btn.ghost{background:var(--panel-2);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--bad);color:#3a0a04;box-shadow:inset 0 -4px 0 rgba(120,20,0,.35)}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border-radius:16px;padding:8px 10px;border:1.5px solid transparent}
.bitem img{flex:none;width:66px;height:66px;object-fit:cover;object-position:50% 62%;border-radius:12px;background:var(--panel)}
.bitem .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bitem .nm{font-weight:700;font-size:15.5px}
.bitem .ds{font-size:12.5px;color:var(--ink-dim)}
.bitem .costs .cost{background:var(--panel);font-size:13px;padding:3px 7px}
.bitem.off{opacity:.62}
.bitem:not(.off){border-color:var(--line)}
.bitem .go{flex:none;font-weight:700;font-size:13px;color:var(--sun)}

#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,26,36,.6);padding:20px}
.card{width:min(340px,100%);background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:22px 20px 18px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{margin:0 0 4px;font-size:22px}
.card .sub{color:var(--ink-dim);font-size:14px;margin-bottom:12px}
.loot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.prize{margin:6px auto 2px;width:112px;height:112px;border-radius:28px;background:radial-gradient(circle at 50% 45%, #2d7f96, var(--panel-2));display:grid;place-items:center;animation:prize 1.6s ease-in-out infinite}
.prize svg{width:76px;height:76px}
@keyframes prize{50%{transform:translateY(-5px) rotate(3deg)}}
.pname{font-weight:700;font-size:18px;color:var(--sun)}
.pdesc{font-size:13px;color:var(--ink-dim)}
.tag{display:inline-block;background:var(--good);color:#083b14;font-weight:700;font-size:12.5px;border-radius:999px;padding:3px 10px;margin-bottom:6px}

#toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(6,36,48,.92);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;
  font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){ .prize,#quest.done{animation:none} }
</style>
</head>
<body>

<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="top" class="gut">
      <div id="resbar"></div>
      <div id="row2">
        <button id="quest" type="button"></button>
        <button class="round" id="btnSound" type="button" aria-label="声音开关"></button>
        <button class="round" id="btnMenu" type="button" aria-label="菜单">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <div id="bottom" class="gut">
      <div id="parts"></div>
      <div id="stat"></div>
    </div>
  </div>

  <div id="pzui" class="gut" hidden>
    <div id="pzhead">
      <button id="pzback" type="button">撤离</button>
      <div id="pzname"></div>
      <div id="pzcount"></div>
    </div>
    <div id="pzbar"><i></i></div>
    <div id="pzhint"></div>
  </div>

  <div id="scrim" hidden></div>
  <div id="sheet" class="gut" hidden></div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app'), cv = $('#cv');
let g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ---------- data ---------- */
const N = 13, C = 6, TW = 32, TH = 16, LH = 18;
const RES = {
  w: { name: '木材', col: '#c98a4b' },
  m: { name: '金属', col: '#9aa7b4' },
  p: { name: '塑料', col: '#4fb3e8' },
  g: { name: '玻璃', col: '#6fd08c' },
};
const RK = ['w', 'm', 'p', 'g'];
// pixel colours in the salvage pictures, and which material each one turns into
const PAL = {
  w: { col: '#b98a5c', r: 'w' }, n: { col: '#6f4a2f', r: 'w' },
  m: { col: '#9ba5ad', r: 'm' }, k: { col: '#3a4047', r: 'm' }, r: { col: '#b4553a', r: 'm' },
  p: { col: '#3f7fae', r: 'p' }, y: { col: '#e5b42f', r: 'p' },
  g: { col: '#6f9a58', r: 'g' }, o: { col: '#dcd7ca', r: 'g' },
};
const PARTS = {
  gear:    { name: '齿轮组', desc: '回收站的核心零件' },
  turbine: { name: '涡轮',   desc: '风力发电机的核心零件' },
  lens:    { name: '透镜',   desc: '灯塔的核心零件' },
  seed:    { name: '种子箱', desc: '农田的核心零件' },
};
const PK = ['gear', 'turbine', 'lens', 'seed'];
const BLD = {
  shelter:    { name: '工棚',       part: null,      cost: { w: 30, m: 10 },        desc: '施工队 +1，填海更快' },
  recycler:   { name: '回收站',     part: 'gear',    cost: { w: 20, m: 40, p: 10 }, desc: '自动分拣垃圾，持续产出材料' },
  windmill:   { name: '风力发电机', part: 'turbine', cost: { m: 50, p: 30 },        desc: '所有回收站产量 +50%' },
  lighthouse: { name: '灯塔',       part: 'lens',    cost: { w: 30, m: 60, g: 40 }, desc: '驱散迷雾，露出更远的海域', max: 1 },
  farm:       { name: '农田',       part: 'seed',    cost: { w: 40, p: 20, g: 10 }, desc: '清扫带回的材料 +20%' },
};
const BK = ['shelter', 'recycler', 'windmill', 'lighthouse', 'farm'];

function disc(n, fn) {
  const rows = [], c = (n - 1) / 2;
  for (let y = 0; y < n; y++) { let r = ''; for (let x = 0; x < n; x++) r += fn(Math.hypot(x - c, y - c), Math.atan2(y - c, x - c)) || '.'; rows.push(r); }
  return rows;
}
const PICS = {
  crate: { name: '漂流木箱', rows: ['nnnnnnn','nnwwwnn','nwnwnwn','nwwnwwn','nwnwnwn','nnwwwnn','nnnnnnn'] },
  barrel: { name: '生锈油桶', rows: ['.mmmmm.','rrrrrrr','rrrrrrr','mmmmmmm','yykyyky','mmmmmmm','rrrrrrr','rrrrrrr','.mmmmm.'] },
  jerrycan: { name: '油罐', rows: ['.kkk..m','.k.k.mm','rrrrrrr','rorrror','rrororr','rrrorrr','rrororr','rorrror','rrrrrrr'] },
  tire: { name: '旧轮胎', rows: disc(9, d => d > 4.4 || d < 1.6 ? 0 : d < 2.4 ? 'm' : 'k') },
  boat: { name: '搁浅的渔船', rows: ['......m....','......m....','....oooo...','....oppo...','wwwwwwwwwww','rrrkrrrrrrr','.rrrrrrkrr.','..rrrrrrr..'] },
  car: { name: '报废汽车', rows: ['...rrrrr...','..rpprppr..','rrrrrrrrrro','rnrrrrrnrrr','rkkkrrrkkkr','.kmk...kmk.'] },
  container: { name: '集装箱', rows: ['kkkkkkkkkk','kppkppkppk','kppkppkppk','kprkppkrpk','kppkppkppk','kkkkkkkkkk'] },
  solar: { name: '破损的太阳能板', rows: ['mmmmmmmmmm','mppmppmppm','mpomppmkpm','mmmmmmmmmm','mppmkpmppm','mmmmmmmmmm','...k..k...','..kk..kk..'] },
  radio: { name: '旧电台', rows: ['.......k.','......k..','nnnnnnnnn','nkmkmnoon','nmkmknmmn','nkmkmnyrn','nnnnnnnnn'] },
  generator: { name: '柴油发电机', rows: ['.kkkkkkkk.','kyyyyyyyyk','kykmkmkyyk','kykmkmkyrk','kyyyyyyyyk','kkkkkkkkkk','.kk....kk.'] },
  drone: { name: '坠毁的无人机', rows: ['kkk.....kkk','.m.......m.','.mmmyyymmm.','...mmpmm...','...k...k...'] },
  toolbox: { name: '工具箱', rows: ['...kkk...','...k.k...','rrrrrrrrr','rrrrmrrrr','rrrrrrrrr','rrrrrrrrr'] },
};
const FIXED = [
  [8,6,'crate','gear'], [6,9,'barrel','gear'], [3,5,'boat','turbine'], [5,3,'radio','lens'], [9,4,'car','turbine'],
  [2,8,'container','seed'], [10,9,'crate','seed'], [6,1,'solar','lens'], [10,2,'generator','turbine'], [1,3,'container','gear'],
  [11,6,'radio','lens'], [3,11,'toolbox','gear'], [12,11,'generator','turbine'], [0,7,'solar','seed'], [8,12,'car','lens'],
];
const DRIFT = ['tire', 'barrel', 'jerrycan', 'crate', 'toolbox', 'drone'];
const QUESTS = [
  { t: '清扫岸边的漂流木箱', p: s => [Math.min(1, s.stats.cleared), 1], rw: { w: 20, m: 10 } },
  { t: '点岛边的海面，填出第一块陆地', p: s => [Math.min(1, s.stats.filled), 1], rw: { w: 30, m: 20 } },
  { t: '点空地，建造一座工棚', p: s => [Math.min(1, count('shelter')), 1], rw: { m: 20, p: 10 } },
  { t: '用齿轮组建造回收站', p: s => [Math.min(1, count('recycler')), 1], rw: { w: 30, p: 20 } },
  { t: '清扫搁浅的渔船，挖出涡轮', p: s => [Math.min(1, s.stats.found.turbine), 1], rw: { m: 30 } },
  { t: '建造风力发电机', p: s => [Math.min(1, count('windmill')), 1], rw: { w: 30, g: 20 } },
  { t: '把陆地扩张到 14 格', p: s => [Math.min(14, landCount()), 14], rw: { w: 40, m: 40 } },
  { t: '找到透镜，建造灯塔', p: s => [Math.min(1, count('lighthouse')), 1], rw: { p: 40, g: 20 } },
  { t: '去新海域找种子箱，建造农田', p: s => [Math.min(1, count('farm')), 1], rw: { w: 60, m: 40 } },
  { t: '把陆地扩张到 24 格', p: s => [Math.min(24, landCount()), 24], rw: { w: 80, m: 80, p: 40 } },
  { t: '把任意建筑升到 3 级', p: s => [Math.min(3, maxLv()), 3], rw: { g: 60, p: 60 } },
  { t: '把陆地扩张到 40 格', p: s => [Math.min(40, landCount()), 40], rw: { w: 200, m: 200, p: 100, g: 100 } },
];

/* ---------- utils ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const key = (i, j) => i + ',' + j;
const hash = (i, j) => { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const easeOutBack = t => { t = clamp(t, 0, 1); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const shadeCache = new Map();
function shade(hex, f) {
  const k = hex + f; let v = shadeCache.get(k); if (v) return v;
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, a = Math.abs(f);
  r = Math.round(r + (t - r) * a); gg = Math.round(gg + (t - gg) * a); b = Math.round(b + (t - b) * a);
  v = `rgb(${r},${gg},${b})`; shadeCache.set(k, v); return v;
}
function mix(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const c = k => Math.round(lerp(a >> k & 255, b >> k & 255, t));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}
const fmt = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(Math.floor(n));

/* ---------- part icons (shared by DOM + canvas) ---------- */
const circ = (cx, cy, r) => `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;
const ICON = (() => {
  let gear = '';
  for (let k = 0; k < 16; k++) {
    const r = k % 2 ? 7.6 : 10.4, a0 = (k - 0.32) * Math.PI / 8, a1 = (k + 0.32) * Math.PI / 8;
    gear += `${k ? 'L' : 'M'}${(12 + r * Math.cos(a0)).toFixed(2)} ${(12 + r * Math.sin(a0)).toFixed(2)}L${(12 + r * Math.cos(a1)).toFixed(2)} ${(12 + r * Math.sin(a1)).toFixed(2)}`;
  }
  gear += 'Z' + circ(12, 12, 3.2);
  let blades = '';
  for (let k = 0; k < 3; k++) {
    const a = k * Math.PI * 2 / 3 - Math.PI / 2, P = (r, d) => `${(12 + r * Math.cos(a + d)).toFixed(2)} ${(12 + r * Math.sin(a + d)).toFixed(2)}`;
    blades += `M${P(1.5, -1.2)}L${P(6, -0.5)}L${P(11, 0.08)}L${P(6.5, 0.42)}L${P(1.5, 1.2)}Z`;
  }
  return {
    gear:    [{ d: gear, f: '#c9d3dd' }, { d: circ(12, 12, 5.4) + circ(12, 12, 3.2), f: '#8e9aa6' }],

  if (W > 0) {
    if (PZ) { tickPuzzle(dt); if (PZ) drawPuzzle(t); }
    else { tickWorld(dt, now); drawWorld(now, t); hudT += dt; if (hudT > 1) { hudT = 0; hud(); } saveT += dt; if (saveT > 10) { saveT = 0; save(); } }
  }
  requestAnimationFrame(frame);
}
function start() {
  S = load();
  let away = 0;
  if (S) {
    away = Math.min(4 * 3600, Math.max(0, (Date.now() - S.last) / 1000));
    const n = Math.floor(prodRate() * away);
    if (n >= 5) { const o = { w: Math.round(n * .35), m: Math.round(n * .3), p: Math.round(n * .2), g: Math.round(n * .15) }; for (const k in o) S.res[k] += o[k]; setTimeout(() => toast(`你不在的时候，回收站攒了 ${n} 份材料`), 600); }
    S.piles.forEach(p => { delete p.pal; delete p.born; });
  } else S = newState();
  resize(); cam.s = clamp(W / 330, 0.9, 1.7); syncWalkers(); hud();
  new ResizeObserver(resize).observe(app);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  requestAnimationFrame(frame);
}
window.__game = { get S() { return S; }, get PZ() { return PZ; }, pzLayout, startPuzzle, hud, cam, iso, toScreen };
start();
})();
